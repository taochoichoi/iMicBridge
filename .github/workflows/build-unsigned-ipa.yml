name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build app (unsigned)
        run: |
          set -euo pipefail
          xcodebuild \
            -project iMicBridge.xcodeproj \
            -scheme iMicBridge \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/iMicBridge.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/iMicBridge.app
          cd build
          /usr/bin/zip -qry iMicBridge-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: iMicBridge-unsigned-ipa
          path: build/iMicBridge-unsigned.ipa
          if-no-files-found: error
